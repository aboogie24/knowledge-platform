apiVersion: v2
name: knowledge-platform
description: Deploys Knowledge Platform services (ingestion worker and MCP server) with a Meilisearch dependency.
type: application
version: 0.1.2
appVersion: "0.0.1"
dependencies:
  - name: meilisearch
    version: 0.19.0
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
  - name: neo4j
    version: 2025.10.1
    repository: https://neo4j.github.io/helm-charts
    condition: neo4j.enabled
