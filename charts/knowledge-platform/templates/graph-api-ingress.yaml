{{- if and .Values.graphApi.enabled .Values.graphApi.ingress.enabled }}
{{- $fullName := include "knowledge-platform.graphApi.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/component: graph-api
    {{- include "knowledge-platform.labels" . | nindent 4 }}
  {{- with .Values.graphApi.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.graphApi.ingress.className }}
  ingressClassName: {{ .Values.graphApi.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.graphApi.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.graphApi.service.port }}
          {{- end }}
    {{- end }}
  {{- if .Values.graphApi.ingress.tls }}
  tls:
    {{- range .Values.graphApi.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}
