{{- if .Values.graphApi.enabled }}
{{- $registry := .Values.global.imageRegistry | trimSuffix "/" }}
{{- $imageRepo := ternary (printf "%s/%s" $registry .Values.graphApi.image.repository) .Values.graphApi.image.repository (ne $registry "") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-platform.graphApi.fullname" . }}
  labels:
    app.kubernetes.io/component: graph-api
    {{- include "knowledge-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.graphApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: graph-api
      {{- include "knowledge-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: graph-api
        {{- include "knowledge-platform.selectorLabels" . | nindent 8 }}
      {{- with .Values.graphApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "knowledge-platform.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: graph-api
          image: "{{ $imageRepo }}:{{ .Values.graphApi.image.tag }}"
          imagePullPolicy: {{ .Values.graphApi.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.graphApi.service.port | quote }}
            - name: LOG_LEVEL
              value: "info"
            - name: NEO4J_URI
              value: {{ .Values.graphApi.neo4j.uri | quote }}
            - name: NEO4J_USER
              value: {{ .Values.graphApi.neo4j.user | quote }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.neo4j.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: neo4jPassword
                  optional: true
            {{- if .Values.graphApi.neo4j.authSecretName }}
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.graphApi.neo4j.authSecretName }}
                  key: NEO4J_AUTH
                  optional: true
            {{- end }}
            - name: USE_ANTHROPIC
              value: {{ ternary "true" "false" .Values.graphApi.llm.useAnthropic | quote }}
            - name: ANTHROPIC_MODEL
              value: {{ .Values.graphApi.llm.anthropicModel | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.graphApi.llm.openaiModel | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.openai.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: openaiApiKey
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.anthropic.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: anthropicApiKey
                  optional: true
            {{- with .Values.graphApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.graphApi.service.port }}
              name: http
          resources:
            {{- toYaml .Values.graphApi.resources | nindent 12 }}
      {{- with .Values.graphApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.graphApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.graphApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
