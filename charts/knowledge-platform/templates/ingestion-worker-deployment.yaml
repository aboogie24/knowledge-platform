{{- if .Values.ingestionWorker.enabled }}
{{- $registry := .Values.global.imageRegistry | trimSuffix "/" }}
{{- $imageRepo := ternary (printf "%s/%s" $registry .Values.ingestionWorker.image.repository) .Values.ingestionWorker.image.repository (ne $registry "") }}
{{- $meiliHost := printf "%s-meilisearch" (include "knowledge-platform.fullname" .) }}
{{- $meiliUrl := printf "http://%s:7700" $meiliHost }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-platform.ingestionWorker.fullname" . }}
  labels:
    app.kubernetes.io/component: ingestion-worker
    {{- include "knowledge-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingestionWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: ingestion-worker
      {{- include "knowledge-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingestion-worker
        {{- include "knowledge-platform.selectorLabels" . | nindent 8 }}
      {{- with .Values.ingestionWorker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "knowledge-platform.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ingestion-worker
          image: "{{ $imageRepo }}:{{ .Values.ingestionWorker.image.tag }}"
          imagePullPolicy: {{ .Values.ingestionWorker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.ingestionWorker.service.port }}
              name: http
          env:
            - name: WEBHOOK_PORT
              value: {{ .Values.ingestionWorker.service.port | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.ingestionWorker.github.repo | quote }}
            - name: GITHUB_BRANCH
              value: {{ .Values.ingestionWorker.github.branch | quote }}
            - name: GITHUB_DOCS_PATH
              value: {{ .Values.ingestionWorker.github.docsPath | quote }}
            - name: INGESTION_MODE
              value: {{ .Values.ingestionWorker.ingestion.mode | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.ingestionWorker.ingestion.pollInterval | quote }}
            - name: CHUNK_SIZE
              value: {{ .Values.ingestionWorker.ingestion.chunkSize | quote }}
            - name: CHUNK_OVERLAP
              value: {{ .Values.ingestionWorker.ingestion.chunkOverlap | quote }}
            - name: MEILISEARCH_URL
              value: {{ $meiliUrl | quote }}
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.meilisearch.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: {{ default "masterKey" .Values.secrets.meilisearch.keyRef }}
                  optional: true
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.slack.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: slackSigningSecret
                  optional: true
            - name: REDIS_URL
              value: {{ .Values.ingestionWorker.redis.url | quote }}
            - name: REDIS_STREAM
              value: {{ .Values.ingestionWorker.redis.stream | quote }}
            - name: REDIS_DLQ_STREAM
              value: {{ .Values.ingestionWorker.redis.dlqStream | quote }}
            - name: REDIS_CONSUMER_GROUP
              value: {{ .Values.ingestionWorker.redis.consumerGroup | quote }}
            - name: REDIS_CONSUMER_NAME
              value: {{ .Values.ingestionWorker.redis.consumerName | quote }}
            - name: NEO4J_URI
              value: {{ .Values.ingestionWorker.neo4j.uri | quote }}
            - name: NEO4J_USER
              value: {{ .Values.ingestionWorker.neo4j.user | quote }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.neo4j.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: neo4jPassword
                  optional: true
            - name: OPENAI_MODEL
              value: {{ .Values.ingestionWorker.llm.openaiModel | quote }}
            - name: ANTHROPIC_MODEL
              value: {{ .Values.ingestionWorker.llm.anthropicModel | quote }}
            - name: USE_ANTHROPIC
              value: {{ ternary "true" "false" .Values.ingestionWorker.llm.useAnthropic | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.openai.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: openaiApiKey
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "knowledge-platform.fullname" .) .Values.secrets.anthropic.existingSecret | default (include "knowledge-platform.fullname" .) }}
                  key: anthropicApiKey
                  optional: true
            {{- if .Values.ingestionWorker.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestionWorker.existingSecret }}
                  key: GITHUB_TOKEN
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestionWorker.existingSecret }}
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
            {{- end }}
            {{- if .Values.secrets.create }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "knowledge-platform.fullname" . }}
                  key: githubToken
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "knowledge-platform.fullname" . }}
                  key: githubWebhookSecret
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingestionWorker.resources | nindent 12 }}
      {{- with .Values.ingestionWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestionWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestionWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
