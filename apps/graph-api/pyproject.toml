[project]
name = "graph-api"
version = "0.0.1"
description = "GraphQL API for querying the knowledge graph (Graphiti/Neo4j)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "strawberry-graphql[fastapi]>=0.235.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "graphiti-core>=0.24.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
]

[project.scripts]
graph_api = "graph_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_api"]
